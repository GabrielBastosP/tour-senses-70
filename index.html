<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Plan coordinates are pixels of the floor-plan image at 1971×1876.
// Scale from the plan's own dimensions (gourmet 7,44 m, living 3,50 × 5,00 m): 168 px = 1 m.
const S = 168, IW = 1971, IH = 1876, H = 2.6, EYE = 1.62, R = 0.2;
const m = v => v / S;
const CX = m(965), CZ = m(906);

// ---------- geometry data ----------
const WALLS = [
  // outer
  [295,157,1040,185],[1140,157,1310,185],[1515,157,1635,185],
  [295,185,322,340],[295,590,322,690],[295,820,322,945],
  [295,1630,1635,1655],
  [1605,185,1635,1290],[1605,1440,1635,1630],
  // interior
  [925,185,945,610],[925,590,1040,610],[1160,590,1200,610],
  [1180,185,1200,635],[1180,755,1200,790],[1180,770,1605,790],
  [322,655,735,675],[715,675,735,690],[715,770,735,925],
  [1000,610,1020,640],[1000,755,1020,1140],
  [322,900,1005,925],[445,925,470,1140],[860,1120,1020,1140],
  // shafts
  [945,185,975,325],[470,930,500,1035],[322,875,460,905],[1570,1505,1600,1625],
];
// [rect, sill height]; glass from sill to 2.2 m
const WINDOWS = [
  [[1040,157,1140,185],1.6],[[1310,157,1515,185],0.9],
  [[295,340,322,590],0.9],[[295,690,322,820],1.6],[[295,945,322,1140],0.9],
  [[295,1140,322,1630],0.0],[[1605,1290,1635,1440],0.9],
];
const DOORS = [[1040,590,1160,610],[1180,635,1200,755],[715,690,735,770],[1000,640,1020,755]];
// footprints (plan px) of furniture you can't walk through
const N_CHAIRS = [[455,1220,525,1285],[550,1220,620,1285],[640,1220,710,1285],[735,1225,805,1290]];
const S_CHAIRS = [[455,1385,525,1450],[550,1390,620,1455],[640,1390,710,1455],[735,1380,805,1445]];
const COLL = [
  [425,190,690,540],[335,205,425,270],[690,205,775,270],[825,190,922,560],[420,620,700,652],
  [735,805,1000,900],[598,815,715,900],[500,800,565,870],[466,675,474,880],
  [950,490,1030,590],[975,365,1055,430],[945,331,1170,339],
  [1435,190,1600,500],[1390,200,1430,260],[1205,190,1300,530],[1500,520,1600,768],[1335,670,1500,768],
  [1445,890,1595,1575],[1185,800,1270,895],[1320,800,1410,895],[1450,800,1565,870],
  [1290,1090,1375,1140],[1260,1015,1330,1085],[1025,870,1085,1140],[1025,1270,1335,1370],
  [430,1255,830,1405],...N_CHAIRS,...S_CHAIRS,
  [322,1520,1410,1625],[1410,1500,1555,1625],
  [510,930,735,1030],[735,930,905,1030],[905,925,1000,1115],[345,950,410,1105],
];
const ROOMS = [
  {n:'Suíte',d:'3,65 × 2,77 m',r:[322,185,1000,655],go:[760,580,.35]},
  {n:'Banho suíte',d:'2,33 × 1,33 m',r:[322,675,715,900]},
  {n:'Closet',d:'1,59 × 1,76 m',r:[735,675,1000,900]},
  {n:'Banho social',d:'1,34 × 2,44 m',r:[945,185,1180,590],go:[1100,470,0]},
  {n:'Quarto',d:'2,45 × 3,50 m',r:[1200,185,1605,770],go:[1330,620,-.2]},
  {n:'Circulação',d:'0,93 m',r:[1020,590,1180,1140]},
  {n:'Living',d:'3,50 × 5,00 m',r:[1180,790,1605,1630],go:[1400,1450,1.35]},
  {n:'Gourmet e jantar',d:'7,44 m de frente',r:[322,1140,1180,1630],go:[930,1470,1.45]},
  {n:'Área de serviço',d:'2,92 × 1,19 m',r:[470,925,1000,1140],go:[650,1080,0]},
  {n:'Depósito',d:'0,70 × 1,32 m',r:[322,925,445,1140]},
];

// ---------- setup ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 600);
camera.rotation.order = 'YXZ';
const controls = new OrbitControls(camera, canvas);
controls.target.set(CX, 0, CZ);
controls.enableDamping = true;
controls.maxPolarAngle = 1.42;
controls.minDistance = 3; controls.maxDistance = 26;

const img = new Image();
img.src = 'planta70.jpg';
await img.decode().catch(() => {
  document.getElementById('loading').innerHTML = '<div id="err">Não consegui carregar a planta.</div>';
  throw new Error('plan image');
});
const tex = new THREE.Texture(img);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
tex.needsUpdate = true;

// sample plan colours so furniture sides match their rendered tops
const sc = document.createElement('canvas'); sc.width = 492; sc.height = 469;
const sx = sc.getContext('2d', {willReadFrequently:true}); sx.drawImage(img, 0, 0, sc.width, sc.height);
const k = sc.width / IW;
function sample(r, f = .82){
  const w = r[2]-r[0], h = r[3]-r[1];
  const x = Math.round((r[0]+w*.3)*k), y = Math.round((r[1]+h*.3)*k);
  const d = sx.getImageData(x, y, Math.max(1,Math.round(w*.4*k)), Math.max(1,Math.round(h*.4*k))).data;
  let rr=0,gg=0,bb=0,n=0; for(let i=0;i<d.length;i+=4){rr+=d[i];gg+=d[i+1];bb+=d[i+2];n++;}
  return new THREE.Color(`rgb(${Math.round(rr/n*f)},${Math.round(gg/n*f)},${Math.round(bb/n*f)})`);
}

const planMat = new THREE.MeshStandardMaterial({map:tex, roughness:.85});
const wallMat = new THREE.MeshStandardMaterial({color:0xece7df, roughness:.95});
const wallTop = new THREE.MeshStandardMaterial({color:0x3b3e44, roughness:1});
const glassMat = new THREE.MeshPhysicalMaterial({color:0xcfe3ea, roughness:.05, metalness:0, transparent:true, opacity:.16, depthWrite:false});
const frameMat = new THREE.MeshStandardMaterial({color:0x2c2e33, roughness:.6, metalness:.3});
// textures cropped from the developer's renders (oak veneer, travertine, suite panel, linen sheer, brass art, rug)
const texLoader = new THREE.TextureLoader();
const loadTx = n => texLoader.loadAsync(n).then(t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; return t; }).catch(() => null);
const [txOak, txTrav, txPanel, txSheer, txArt, txRug] = await Promise.all(['tex-oak.jpg','tex-travertine.jpg','tex-panel.jpg','tex-sheer.jpg','art.jpg','tex-rug.jpg'].map(loadTx));
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), .04).texture;

const colliders = [];
const apt = new THREE.Group(); scene.add(apt);

function block(r, y0, y1, side, top = planMat, opts = {}){
  const w = m(r[2]-r[0]), d = m(r[3]-r[1]), h = y1 - y0;
  const g = new THREE.BoxGeometry(w, h, d);
  const cx = m(r[0]) + w/2, cz = m(r[1]) + d/2;
  const uv = g.attributes.uv, p = g.attributes.position;
  for (let i = 8; i < 12; i++) uv.setXY(i, (p.getX(i)+cx)*S/IW, 1 - (p.getZ(i)+cz)*S/IH);
  const mesh = new THREE.Mesh(g, [side, side, top, side, side, side]);
  mesh.position.set(cx, y0 + h/2, cz);
  mesh.castShadow = opts.cast ?? true; mesh.receiveShadow = true;
  apt.add(mesh);
  if (opts.collide) colliders.push(r);
  return mesh;
}

// floor (the rendered plan itself) and walls
const floor = block([295,157,1635,1655], -0.04, 0, wallTop, planMat, {cast:false});
WALLS.forEach(r => block(r, 0, H, wallMat, wallTop, {collide:true}));
DOORS.forEach(r => block(r, 2.1, H, wallMat, wallTop));
WINDOWS.forEach(([r, sill]) => {
  if (sill > 0) block(r, 0, sill, wallMat, wallTop, {collide:true});
  else colliders.push(r);
  block(r, 2.2, H, wallMat, wallTop);
  const vertical = (r[3]-r[1]) > (r[2]-r[0]);
  const mid = vertical ? [r[0]+11, r[1], r[2]-11, r[3]] : [r[0], r[1]+11, r[2], r[3]-11];
  block(mid, sill, 2.2, glassMat, glassMat, {cast:false});
  const f1 = vertical ? [r[0], r[1], r[2], r[1]+6] : [r[0], r[1], r[0]+6, r[3]];
  const f2 = vertical ? [r[0], r[3]-6, r[2], r[3]] : [r[2]-6, r[1], r[2], r[3]];
  block(f1, sill, 2.2, frameMat, frameMat); block(f2, sill, 2.2, frameMat, frameMat);
});
colliders.push(...COLL);

// ---------- furniture ----------
let s2 = 11; const rnd2 = () => (s2 = (s2*16807) % 2147483647) / 2147483647;
function canvasTex(draw, size = 512){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const marbleTex = canvasTex((x, n) => {
  x.fillStyle = '#efedea'; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 30; i++){
    x.strokeStyle = `rgba(118,116,112,${.06 + rnd2()*.22})`; x.lineWidth = .5 + rnd2()*2.2;
    let px = rnd2()*n, py = rnd2()*n; x.beginPath(); x.moveTo(px, py);
    for (let j = 0; j < 5; j++){ const nx = px + rnd2()*200 - 100, ny = py + rnd2()*200 - 100;
      x.bezierCurveTo(px + rnd2()*80 - 40, py + rnd2()*80 - 40, nx + rnd2()*80 - 40, ny + rnd2()*80 - 40, nx, ny); px = nx; py = ny; }
    x.stroke();
  }
});
const woodTex = base => canvasTex((x, n) => {
  x.fillStyle = base; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 160; i++){
    x.strokeStyle = rnd2() < .5 ? `rgba(30,18,8,${.05 + rnd2()*.12})` : `rgba(255,230,200,${.03 + rnd2()*.06})`;
    x.lineWidth = 1 + rnd2()*3; const y0 = rnd2()*n; x.beginPath(); x.moveTo(0, y0);
    x.bezierCurveTo(n*.3, y0 + rnd2()*12 - 6, n*.6, y0 + rnd2()*12 - 6, n, y0 + rnd2()*8 - 4); x.stroke();
  }
});
const std = (color, roughness = .9, extra = {}) => new THREE.MeshStandardMaterial({color, roughness, ...extra});
const M = {
  linen: std(0xf2eee8, .95), terracotta: std(0xb46a4d, .95), beige: std(0xd2c5b4, .95),
  sofa: std(sample([1470,950,1540,1150], 1.0), .97), arm: std(sample([1200,820,1250,850], .95), .97),

const B = (g, w, h, d, mat, x = 0, y = 0, z = 0) => {
  const geo = new THREE.BoxGeometry(w, h, d), T = mat.userData && mat.userData.tile;
  if (T){ const uv = geo.attributes.uv, dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++){ const q = f*4 + i; uv.setXY(q, uv.getX(q)*dims[f][0]/T, uv.getY(q)*dims[f][1]/T); } }
  const me = mk(geo, mat, x, y + h/2, z); g.add(me); return me;
};
const RB = (g, w, h, d, r, mat, x = 0, y = 0, z = 0) => {
  const rr = Math.max(.002, Math.min(r, w/2, h/2, d/2) - .002);

};

function place(r, face, build){
  const ew = face === 'E' || face === 'W', W = m(r[2]-r[0]), D = m(r[3]-r[1]);

}

const LIGHTS = {
  manha: {sun:[14,7,5], sc:0xffe0b6, si:3.4, sky:0xe4eefa, gnd:0xd9cbb6, hi:.9, amb:1.25, bg:0xa8c9e6, lamp:0, exp:1.1, cityGlow:0x000000},
  tarde: {sun:[-14,5,-4], sc:0xffa868, si:3, sky:0xf6d2b0, gnd:0xb89a80, hi:.6, amb:.75, bg:0xe9a77e, lamp:2.5, exp:1.05, cityGlow:0x000000},
  noite: {sun:[-6,12,-8], sc:0x8ea6ff, si:.2, sky:0x26365e, gnd:0x2a2420, hi:.15, amb:.12, bg:0x0b1427, lamp:7, exp:1.15, cityGlow:0x3a2c18},
};
function setLight(key){
  const L = LIGHTS[key];
  sun.position.set(CX + L.sun[0], L.sun[1], CZ + L.sun[2]);
  sun.color.set(L.sc); sun.intensity = L.si;
  hemi.color.set(L.sky); hemi.groundColor.set(L.gnd); hemi.intensity = L.hi; amb.intensity = L.amb;
  const K = SKY[key];
  scene.background = new THREE.Color(K.hor); scene.fog.color.set(K.hor);
  skyMat.uniforms.top.value.set(K.top); skyMat.uniforms.hor.value.set(K.hor); skyMat.uniforms.bot.value.set(K.bot); skyMat.uniforms.sunCol.value.set(K.sunCol);
  skyMat.uniforms.sunDir.value.set(L.sun[0], L.sun[1], L.sun[2]).normalize();
  facadeMat.emissiveIntensity = K.facade; crownLED.emissiveIntensity = K.crown; lobbyGlass.emissiveIntensity = K.lobby;
  presetRooms(key);
  cityMat.emissive.set(L.cityGlow);
  const ek = {manha:.7, tarde:.5, noite:.18}[key]; ENV.forEach(([mt, k]) => mt.envMapIntensity = k*ek);
  ground.material.color.set(key === 'noite' ? 0x1c2026 : 0x8b8f78);
  tallMats.forEach(mt => mt.emissiveIntensity = K.facade*.9);
  renderer.toneMappingExposure = L.exp;
  document.querySelectorAll('[data-light]').forEach(b => b.setAttribute('aria-pressed', b.dataset.light === key));
  current.light = key; applyAmb();
}
function applyAmb(){ const L = LIGHTS[current.light], w = current.mode === 'walk'; amb.intensity = L.amb*(w ? .4 : 1); hemi.intensity = L.hi*(w ? .75 : 1); }

// ---------- modes ----------
const current = {mode:'plan', light:'manha'};
const player = {x:m(1230), z:m(1190), yaw:-2.4, pitch:0};
const roomEl = document.getElementById('room'), hint = document.getElementById('hint'), stick = document.getElementById('stick');
const tip = document.getElementById('tip'), mini = document.getElementById('mini'), coarse = matchMedia('(pointer:coarse)').matches;

let facadeSeen = false;
function setMode(mode){
  current.mode = mode;
  const walk = mode === 'walk', fac = mode === 'facade';
  controls.enabled = !walk;
  ceiling.visible = walk; pendants.visible = walk; ceilFx.visible = walk; switchesG.visible = walk; walkOnly.visible = walk;
  apt.visible = !fac; towerShell.visible = fac; labelsG.visible = fac; towerUpper.visible = walk || fac;
  stick.hidden = !(walk && coarse); document.getElementById('lights').hidden = !walk; mini.hidden = !walk;
  document.getElementById('cross').hidden = true; tip.hidden = true;
  if (!walk && document.pointerLockElement) document.exitPointerLock();
  applyAmb();
  ['plan','facade','walk'].forEach(k => document.getElementById('v-' + k).setAttribute('aria-pressed', k === mode));
  hint.textContent = walk ? (coarse ? 'Arraste para olhar · controle para andar · toque nos interruptores ou spots para acender/apagar'
                                    : 'Clique para olhar livremente (Esc solta) · WASD anda · Shift corre · E ou clique no interruptor/spot acende e apaga')
                   : fac ? 'Arraste para girar ao redor do prédio · role para aproximar · a unidade está contornada no 6º andar'
                         : 'Arraste para girar · role para aproximar · toque duplo no piso para entrar';
  hint.style.opacity = 1; clearTimeout(hint._t); hint._t = setTimeout(() => hint.style.opacity = 0, 7000);
  camera.fov = walk ? 70 : fac ? 42 : 50; camera.updateProjectionMatrix();
  if (mode === 'plan'){
    Object.assign(controls, {minDistance: 3, maxDistance: 26, maxPolarAngle: 1.42});
    camera.position.set(CX + 2, 12, CZ + 10.5); controls.target.set(CX, 0, CZ); controls.update();
    roomEl.textContent = 'Vista geral · 70 m²';
  }
  if (fac){
    Object.assign(controls, {minDistance: 18, maxDistance: 190, maxPolarAngle: 1.53});
    camera.position.set(TCX + 66, 2, TZ0 - 92); controls.target.set(TCX, 9, TCZ); controls.update();
    roomEl.textContent = 'Fachada · unidade no 6º andar';
    if (!facadeSeen){ facadeSeen = true; setLight('tarde'); }
  }
}
function goTo(x, z, yaw){ player.x = m(x); player.z = m(z); player.yaw = yaw; player.pitch = -0.05; setMode('walk'); }

const roomsEl = document.getElementById('rooms');
ROOMS.filter(r => r.go).forEach(r => {
  const b = document.createElement('button'); b.textContent = r.n;
  b.onclick = () => goTo(r.go[0], r.go[1], r.go[2]); roomsEl.appendChild(b);
});
const menuBtn = document.getElementById('menu-btn');
const setMenu = open => { document.body.classList.toggle('menu-open', open); menuBtn.setAttribute('aria-expanded', open); menuBtn.textContent = open ? '✕' : '•••'; };
menuBtn.onclick = () => setMenu(!document.body.classList.contains('menu-open'));
canvas.addEventListener('pointerdown', () => setMenu(false));
document.getElementById('bar').addEventListener('click', e => { if (e.target.closest('#v-plan,#v-facade,#v-walk,#rooms button,#b-ref')) setMenu(false); });
document.getElementById('v-plan').onclick = () => setMode('plan');
document.getElementById('v-facade').onclick = () => setMode('facade');
document.getElementById('v-walk').onclick = () => setMode('walk');
document.querySelectorAll('[data-light]').forEach(b => b.onclick = () => setLight(b.dataset.light));

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape' && !gal.hidden){ gal.hidden = true; return; }
  if (current.mode !== 'walk' || e.repeat) return;
  if (e.code === 'KeyE'){ const r = hoverLR || lrFor(roomAt(player.x, player.z)); if (r) toggleRoom(r); }
  if (e.code === 'KeyL'){ const r = lrFor(roomAt(player.x, player.z)); if (r) toggleRoom(r); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let drag = null, hoverLR = null; const ptr = {x:0, y:0, has:false, type:'mouse'}; const gal = document.getElementById('gal');
const locked = () => document.pointerLockElement === canvas;
const clampPitch = v => Math.max(-1.2, Math.min(1.2, v));
canvas.addEventListener('pointerdown', e => {
  if (current.mode !== 'walk') return;
  drag = {id:e.pointerId, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, t:performance.now()}; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.has = true; ptr.type = e.pointerType;
  if (current.mode !== 'walk') return;
  if (locked()){ player.yaw -= e.movementX*.0022; player.pitch = clampPitch(player.pitch - e.movementY*.0022); return; }
  if (!drag || e.pointerId !== drag.id) return;
  const f = e.pointerType === 'touch' ? .006 : .0045;
  player.yaw += (e.clientX - drag.x) * f;
  player.pitch = clampPitch(player.pitch + (e.clientY - drag.y) * f);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const tap = e.type === 'pointerup' && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6 && performance.now() - drag.t < 450;
  drag = null;
  if (!tap) return;
  const r = pickLight(e.pointerType === 'mouse' && locked() ? null : [e.clientX, e.clientY]);
  if (r) toggleRoom(r);
  else if (e.pointerType === 'mouse' && !locked() && canvas.requestPointerLock) canvas.requestPointerLock();
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
document.addEventListener('pointerlockchange', () => { document.getElementById('cross').hidden = !(locked() && current.mode === 'walk'); });
function pickLight(pos){
  const rect = canvas.getBoundingClientRect();
  const nx = pos ? (pos[0] - rect.left)/rect.width*2 - 1 : 0, ny = pos ? -(pos[1] - rect.top)/rect.height*2 + 1 : 0;
  ray.setFromCamera({x:nx, y:ny}, camera); ray.far = 9;
  const hits = ray.intersectObjects(pickables, false); ray.far = Infinity;
  for (const h of hits){ if (h.object.userData.sw && h.distance > 3.2) continue; return h.object.userData.lr; }
  return null;
}
function toggleRoom(r){ r.on = !r.on; lastLabel = ''; }
let lastLabel = '';

// double-click / double-tap the floor in plan view to walk there
const ray = new THREE.Raycaster(); let lastTap = 0;
function enterAt(cx, cy){
  const rect = canvas.getBoundingClientRect();
  ray.setFromCamera({x:(cx-rect.left)/rect.width*2-1, y:-(cy-rect.top)/rect.height*2+1}, camera);
  const hit = ray.intersectObject(floor)[0];
  if (!hit) return;
  if (blocked(hit.point.x, hit.point.z)) return;
  const dx = hit.point.x - camera.position.x, dz = hit.point.z - camera.position.z;
  player.x = hit.point.x; player.z = hit.point.z; player.yaw = Math.atan2(-dx, -dz); player.pitch = -.05;
  setMode('walk');
}
canvas.addEventListener('dblclick', e => current.mode === 'plan' && enterAt(e.clientX, e.clientY));
canvas.addEventListener('pointerup', e => {
  if (current.mode !== 'plan' || e.pointerType !== 'touch') return;
  const t = performance.now(); if (t - lastTap < 320) enterAt(e.clientX, e.clientY); lastTap = t;
});

// joystick
const knob = document.getElementById('knob'); const joy = {x:0, y:0, id:null};
stick.addEventListener('pointerdown', e => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); moveJoy(e); });
stick.addEventListener('pointermove', e => e.pointerId === joy.id && moveJoy(e));
const endJoy = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', endJoy); stick.addEventListener('pointercancel', endJoy);
function moveJoy(e){
  const r = stick.getBoundingClientRect();
  let x = (e.clientX - r.left - r.width/2) / (r.width/2), y = (e.clientY - r.top - r.height/2) / (r.height/2);
  const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; }
  joy.x = x; joy.y = y; knob.style.transform = `translate(${x*32}px,${y*32}px)`;
}

// ---------- movement ----------
function blocked(x, z){
  const px = x*S, pz = z*S, rr = R*S;
  for (const c of colliders) if (px > c[0]-rr && px < c[2]+rr && pz > c[1]-rr && pz < c[3]+rr) return true;
  return px < 322 || px > 1605 || pz < 185 || pz > 1630;
}
function roomAt(x, z){
  const px = x*S, pz = z*S;
  return ROOMS.find(r => px >= r.r[0] && px <= r.r[2] && pz >= r.r[1] && pz <= r.r[3]);
}
let lastRoom = null, bobT = 0;
function step(dt){
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD) s += 1;
  if (keys.KeyA) s -= 1;
  if (keys.ArrowLeft) player.yaw += 1.8*dt;
  if (keys.ArrowRight) player.yaw -= 1.8*dt;
  f -= joy.y; s += joy.x;
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 2.8 : 1.5) * dt;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const dx = (-sy*f + cy*s) * speed, dz = (-cy*f - sy*s) * speed;
  if (!blocked(player.x + dx, player.z)) player.x += dx;
  if (!blocked(player.x, player.z + dz)) player.z += dz;
  const moving = Math.abs(f) + Math.abs(s) > .05;
  bobT += moving ? dt*(keys.ShiftLeft || keys.ShiftRight ? 10 : 7) : 0;
  camera.position.set(player.x, EYE + (moving ? Math.sin(bobT)*.011 : 0), player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  const room = roomAt(player.x, player.z), lr = lrFor(room);
  const label = room ? `<b>${room.n}</b> · ${room.d}` + (lr ? ` · luz ${lr.on ? 'acesa' : 'apagada'}` : '') : 'Apartamento';
  if (label !== lastLabel){ lastLabel = label; roomEl.innerHTML = label; }
  hoverLR = locked() ? pickLight(null) : (ptr.has && ptr.type === 'mouse' ? pickLight([ptr.x, ptr.y]) : null);
  tip.hidden = !hoverLR; if (hoverLR) tip.textContent = `${hoverLR.on ? 'Apagar' : 'Acender'} a luz · ${hoverLR.id}`;
  canvas.style.cursor = hoverLR ? 'pointer' : '';
  drawMini();
}

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

document.getElementById('l-room').onclick = () => { const r = lrFor(roomAt(player.x, player.z)); if (r) toggleRoom(r); };
document.getElementById('l-all').onclick = () => { const any = LR.some(r => !r.on); LR.forEach(r => r.on = any); };
document.getElementById('b-ref').onclick = () => gal.hidden = false;
document.getElementById('gal-x').onclick = () => gal.hidden = true;
gal.addEventListener('click', e => { if (e.target === gal) gal.hidden = true; });

// minimap: the plan itself, click to jump anywhere that is free
const MX0 = 295, MY0 = 157, MW = 1340, MH = 1498, mctx = mini.getContext('2d');
const miniBase = document.createElement('canvas'); miniBase.width = mini.width; miniBase.height = mini.height;
miniBase.getContext('2d').drawImage(img, MX0, MY0, MW, MH, 0, 0, mini.width, mini.height);
function drawMini(){
  mctx.globalAlpha = 1; mctx.drawImage(miniBase, 0, 0);
  const kx = mini.width/MW, ky = mini.height/MH;
  const x = (player.x*S - MX0)*kx, y = (player.z*S - MY0)*ky, a = Math.atan2(-Math.cos(player.yaw), -Math.sin(player.yaw));
  mctx.fillStyle = 'rgba(211,154,106,.35)'; mctx.beginPath(); mctx.moveTo(x, y); mctx.arc(x, y, 34, a - .6, a + .6); mctx.closePath(); mctx.fill();
  mctx.fillStyle = '#d39a6a'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 3; mctx.beginPath(); mctx.arc(x, y, 7, 0, 7); mctx.fill(); mctx.stroke();
}
mini.addEventListener('pointerdown', e => {
  e.stopPropagation(); const r = mini.getBoundingClientRect();
  const px = (e.clientX - r.left)/r.width*MW + MX0, pz = (e.clientY - r.top)/r.height*MH + MY0;
  if (!blocked(px/S, pz/S)){ player.x = px/S; player.z = pz/S; }
});

setLight('manha'); setMode('plan'); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (current.mode === 'walk') step(dt); else controls.update();
  updateLights(dt); sky.position.copy(camera.position);
  renderer.render(scene, camera);
});
const loading = document.getElementById('loading');
loading.style.opacity = 0; setTimeout(() => loading.remove(), 600);
</script>

</body></html>
